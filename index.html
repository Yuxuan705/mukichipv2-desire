<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MUKICHIP V2: DAILY SOLVER - DESIRE</title>
  
  <!-- 引入 Google Fonts: Bagel Fat One Regular -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&display=swap" rel="stylesheet">
  
  <style>
    /* 引入 GitHub 仓库同目录下的 LiyuShoushu.ttf 字体文件 */
    @font-face {
      font-family: 'Liyu Shoushu';
      src: url('LiyuShoushu.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
    }

    /* 全局配色变量 */
    :root {
      --bg-color: #ffffff;        /* 整体背景颜色：纯白 */
      --main-brown: #926653;      /* 指定褐色文字颜色 */
      --accent-orange: #EEA445;   /* 指定橙色文字与线条颜色 */
      --receipt-bg: #F8F6F3;     /* 指定小票主体背景颜色 */
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-color); /* 纯白背景 */
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      padding: 20px 20px 60px;
      color: var(--main-brown);
      overflow-x: hidden;
    }

    /* 手机端主容器 */
    .mobile-container {
      width: 100%;
      max-width: 340px;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }

    /* 1. 顶部 Muki DESIRE 标牌 */
    .printer-head-wrapper {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 10;
      cursor: pointer;
      transition: transform 0.15s ease;
    }

    .printer-head-wrapper:active {
      transform: scale(0.96);
    }

    .printer-img {
      width: 100%;
      height: auto;
      display: block;
    }

    /* 2. 小票吐票外壳轨道 */
    .receipt-slot {
      width: 100%;
      margin-top: -8px;
      overflow: hidden;
      z-index: 5;
    }

    /* 3. 小票主卡片 (背景 #F8F6F3，无外框线条) */
    .receipt-card {
      width: 100%;
      background-color: var(--receipt-bg);
      border: none;
      border-radius: 0 0 16px 16px;
      padding: 20px 18px 25px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      position: relative;

      /* 吐票平滑滑出动画 */
      transition: transform 0.6s cubic-bezier(0.25, 1, 0.5, 1), filter 0.2s ease;
    }

    /* 吐小票中的动画类 */
    .receipt-card.printing {
      animation: printSlide 1.8s cubic-bezier(0.25, 1, 0.3, 1);
    }

    @keyframes printSlide {
      0% {
        transform: translateY(-80%);
        opacity: 0.3;
        filter: blur(2px);
      }
      100% {
        transform: translateY(0);
        opacity: 1;
        filter: blur(0);
      }
    }

    /* 小票左右两侧半圆缺口（与背景 #ffffff 保持一致） */
    .receipt-card::before, .receipt-card::after {
      content: "";
      position: absolute;
      top: 42%;
      width: 20px;
      height: 20px;
      background-color: var(--bg-color);
      border-radius: 50%;
      z-index: 2;
    }

    .receipt-card::before {
      left: -10px;
    }

    .receipt-card::after {
      right: -10px;
    }

    /* 弧形标题: MUKICHIP V2: DAILY SOLVER */
    .curved-title {
      font-family: 'Bagel Fat One', cursive, sans-serif;
      font-size: 17px;
      color: var(--accent-orange);
      letter-spacing: 0.05em;
      margin-top: 5px;
      margin-bottom: 8px;
      text-transform: uppercase;
    }

    /* 中间购物 Muki 插图 */
    .shopping-muki-img {
      width: 130px;
      height: auto;
      margin: 2px 0 8px;
      display: block;
    }

    /* - MUKI RECEIPT - 标头 */
    .receipt-header-title {
      font-family: 'Bagel Fat One', cursive, sans-serif;
      font-size: 20px;
      color: var(--main-brown);
      letter-spacing: 0.05em;
      margin-bottom: 12px;
    }

    /* 4. 小票元数据信息 (靠左对齐，Liyu Shoushu 字体) */
    .receipt-meta {
      width: 100%;
      font-family: 'Liyu Shoushu', cursive, sans-serif;
      font-size: 13px;
      color: var(--main-brown);
      text-align: left;
      line-height: 1.5;
      margin-bottom: 10px;
      padding: 0 8px;
      text-transform: uppercase;
    }

    /* 细线分割线 */
    .divider-line {
      width: 100%;
      height: 1px;
      background-color: var(--accent-orange);
      margin: 6px 0;
      opacity: 0.6;
    }

    /* TO BUY OR NOT TO BUY? (靠左对齐，与 BUYER 对齐) */
    .question-prompt {
      width: 100%;
      font-family: 'Liyu Shoushu', cursive, sans-serif;
      font-size: 14px;
      color: var(--main-brown);
      letter-spacing: 0.05em;
      margin: 3px 0;
      text-transform: uppercase;
      text-align: left;
      padding: 0 8px;
    }

    /* 5. 答案显示区域 (靠左对齐) */
    .answer-container {
      width: 100%;
      padding: 12px 8px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      text-align: left;
      min-height: 95px;
    }

    /* 中文答案 (靠左对齐，Liyu Shoushu 字体) */
    .zh-text {
      width: 100%;
      font-family: 'Liyu Shoushu', cursive, sans-serif;
      color: var(--main-brown);
      font-size: 18pt;
      line-height: 1.35;
      margin-bottom: 4px;
      word-break: break-word;
      text-align: left;
    }

    /* 英文答案 (靠左对齐，Liyu Shoushu 字体) */
    .en-text {
      width: 100%;
      font-family: 'Liyu Shoushu', cursive, sans-serif;
      color: var(--main-brown);
      font-size: 11px;
      line-height: 1.3;
      text-transform: uppercase;
      word-break: break-word;
      text-align: left;
    }

    /* 6. 条形码与底部印章 */
    .barcode-img {
      width: 90%;
      height: auto;
      max-height: 42px;
      margin: 10px 0 12px;
      object-fit: contain;
    }

    /* 底部印章按钮 (点击跳转到 Instagram) */
    .stamp-link {
      text-decoration: none;
      display: inline-block;
      transition: transform 0.15s ease;
      margin-top: 4px;
    }

    .stamp-link:active {
      transform: scale(0.8);
    }

    .stamp-img {
      width: 85px;
      height: 85px;
      object-fit: contain;
      display: block;
    }

    /* 重新打印按钮提示 */
    .reprint-tip {
      font-family: 'Bagel Fat One', cursive, sans-serif;
      font-size: 12px;
      color: var(--main-brown);
      margin-top: 18px;
      opacity: 0.5;
      cursor: pointer;
      user-select: none;
    }
  </style>
</head>
<body>

  <div class="mobile-container">
    
    <!-- 1. 顶部 Muki DESIRE 标牌 (点击触发重新打印) -->
    <div class="printer-head-wrapper" onclick="printNewReceipt()">
      <img src="top-desire.png" alt="DESIRE Printer" class="printer-img" onerror="this.src='https://via.placeholder.com/340x90/926653/FFFFFF?text=TOP+PRINTER+PNG'">
    </div>

    <!-- 2. 小票吐票外壳轨道 -->
    <div class="receipt-slot">
      <div class="receipt-card" id="receiptCard">
        
        <!-- 弧形标题 -->
        <div class="curved-title">MUKICHIP V2: DAILY SOLVER</div>

        <!-- 中间购物 Muki 插图 -->
        <img src="shopping-muki.png" alt="Shopping Muki" class="shopping-muki-img" onerror="this.src='https://via.placeholder.com/130x90/F8F6F3/926653?text=MIDDLE+MUKI+PNG'">

        <!-- 小票标头 -->
        <div class="receipt-header-title">- MUKI RECEIPT -</div>

        <!-- 小票元数据 (靠左对齐，Liyu Shoushu 字体) -->
        <div class="receipt-meta">
          <div>BUYER: MUKI</div>
          <div>CHECKOUT TIME: <span id="checkoutTime">2026.11.22 20:29:24</span></div>
          <div>TRANSACTION ID: <span id="transactionId">55328675732096</span></div>
        </div>

        <div class="divider-line"></div>
        <!-- 提示问题 (靠左对齐，Liyu Shoushu 字体) -->
        <div class="question-prompt">TO BUY OR NOT TO BUY?</div>
        <div class="divider-line"></div>

        <!-- 答案显示区域 (靠左对齐，Liyu Shoushu 字体) -->
        <div class="answer-container">
          <p class="zh-text" id="zhDisplay">今天不适合买，首先，您需要连接至 Workspace，以打开该扩展。
