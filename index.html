<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MUKICHIP V2: DAILY SOLVER - DESIRE</title>
  
  <!-- 引入 Google Fonts: Bagel Fat One Regular -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&display=swap" rel="stylesheet">
  
  <style>
    /* 引入 GitHub 仓库同目录下的 LiyuShoushu.ttf 字体文件 */
    @font-face {
      font-family: 'Liyu Shoushu';
      src: url('LiyuShoushu.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
    }

    /* 全局配色变量 */
    :root {
      --bg-color: #111111;        /* 页面底色背景 (可根据需求更改) */
      --main-brown: #926653;      /* 指定褐色文字颜色 */
      --accent-orange: #EEA445;   /* 指定橙色文字与线条颜色 */
      --receipt-bg: #F8F6F3;     /* 指定小票背景颜色 */
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-color);
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      padding: 20px 20px 60px;
      color: var(--main-brown);
      overflow-x: hidden;
    }

    /* 手机端主容器 */
    .mobile-container {
      width: 100%;
      max-width: 340px;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }

    /* 1. 顶部 Muki DESIRE 标牌 (预留上传 PNG) */
    .printer-head-wrapper {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 10;
      cursor: pointer;
      transition: transform 0.15s ease;
    }

    .printer-head-wrapper:active {
      transform: scale(0.96);
    }

    .printer-img {
      width: 100%;
      height: auto;
      display: block;
    }

    /* 2. 小票吐票外壳轨道 */
    .receipt-slot {
      width: 100%;
      margin-top: -8px;
      overflow: hidden;
      z-index: 5;
    }

    /* 3. 小票主卡片 (背景 #F8F6F3，无外框线条) */
    .receipt-card {
      width: 100%;
      background-color: var(--receipt-bg); /* #F8F6F3 */
      border: none;                       /* 无外框线条 */
      border-radius: 0 0 16px 16px;
      padding: 20px 18px 25px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      position: relative;

      /* 吐票平滑滑出动画 */
      transition: transform 0.6s cubic-bezier(0.25, 1, 0.5, 1), filter 0.2s ease;
    }

    /* 吐小票中的动画类 */
    .receipt-card.printing {
      animation: printSlide 1.8s cubic-bezier(0.25, 1, 0.3, 1);
    }

    @keyframes printSlide {
      0% {
        transform: translateY(-80%);
        opacity: 0.3;
        filter: blur(2px);
      }
      100% {
        transform: translateY(0);
        opacity: 1;
        filter: blur(0);
      }
    }

    /* 小票左右两侧黑色半圆缺口 */
    .receipt-card::before, .receipt-card::after {
      content: "";
      position: absolute;
      top: 42%;
      width: 20px;
      height: 20px;
      background-color: var(--bg-color);
      border-radius: 50%;
      z-index: 2;
    }

    .receipt-card::before {
      left: -10px;
    }

    .receipt-card::after {
      right: -10px;
    }

    /* 弧形标题: MUKICHIP V2: DAILY SOLVER (橙色 + Bagel Fat One Regular) */
    .curved-title {
      font-family: 'Bagel Fat One', cursive, sans-serif;
      font-size: 17px;
      color: var(--accent-orange); /* #EEA445 */
      letter-spacing: 0.05em;
      margin-top: 5px;
      margin-bottom: 8px;
      text-transform: uppercase;
    }

    /* 中间购物 Muki 插图 (预留上传 PNG) */
    .shopping-muki-img {
      width: 130px;
      height: auto;
      margin: 2px 0 8px;
      display: block;
    }

    /* - MUKI RECEIPT - 标头 (褐色 + Bagel Fat One Regular) */
    .receipt-header-title {
      font-family: 'Bagel Fat One', cursive, sans-serif;
      font-size: 20px;
      color: var(--main-brown); /* #926653 */
      letter-spacing: 0.05em;
      margin-bottom: 12px;
    }

    /* 4. 小票元数据信息 (使用 Liyu Shoushu 字体) */
    .receipt-meta {
      width: 100%;
      font-family: 'Liyu Shoushu', cursive, sans-serif;
      font-size: 13px;
      color: var(--main-brown); /* #926653 */
      text-align: left;
      line-height: 1.5;
      margin-bottom: 10px;
      padding: 0 5px;
      text-transform: uppercase;
    }

    /* 细线分割线 (橙色线) */
    .divider-line {
      width: 100%;
      height: 1px;
      background-color: var(--accent-orange);
      margin: 6px 0;
      opacity: 0.6;
    }

    /* TO BUY OR NOT TO BUY? (使用 Liyu Shoushu 字体) */
    .question-prompt {
      font-family: 'Liyu Shoushu', cursive, sans-serif;
      font-size: 14px;
      color: var(--main-brown); /* #926653 */
      letter-spacing: 0.05em;
      margin: 3px 0;
      text-transform: uppercase;
    }

    /* 5. 答案显示区域 */
    .answer-container {
      width: 100%;
      padding: 12px 5px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 95px;
    }

    /* 中文答案：Liyu Shoushu (褐色 #926653) */
    .zh-text {
      font-family: 'Liyu Shoushu', cursive, sans-serif;
      color: var(--main-brown); /* #926653 */
      font-size: 18pt;
      line-height: 1.35;
      margin-bottom: 4px;
      word-break: break-word;
    }

    /* 英文答案：Liyu Shoushu (褐色 #926653) */
    .en-text {
      font-family: 'Liyu Shoushu', cursive, sans-serif;
      color: var(--main-brown); /* #926653 */
      font-size: 11px;
      line-height: 1.3;
      text-transform: uppercase;
      word-break: break-word;
    }

    /* 6. 条形码与底部印章 */
    .barcode-img {
      width: 90%;
      height: auto;
      max-height: 42px;
      margin: 10px 0 12px;
      object-fit: contain;
    }

    /* 底部印章链接 (预留上传 PNG) */
    .stamp-link {
      text-decoration: none;
      display: inline-block;
      transition: transform 0.15s ease;
      margin-top: 4px;
    }

    .stamp-link:active {
      transform: scale(0.8);
    }

    .stamp-img {
      width: 85px;
      height: 85px;
      object-fit: contain;
      display: block;
    }

    /* 重新打印按钮提示 */
    .reprint-tip {
      font-family: 'Bagel Fat One', cursive, sans-serif;
      font-size: 12px;
      color: #FFFFFF;
      margin-top: 18px;
      opacity: 0.6;
      cursor: pointer;
      user-select: none;
    }
  </style>
</head>
<body>

  <div class="mobile-container">
    
    <!-- 1. 顶部 Muki DESIRE 标牌 (自行替换 top-desire.png) -->
    <div class="printer-head-wrapper" onclick="printNewReceipt()">
      <img src="top-desire.png" alt="DESIRE Printer" class="printer-img" onerror="this.src='https://via.placeholder.com/340x90/926653/FFFFFF?text=TOP+PRINTER+PNG'">
    </div>

    <!-- 2. 小票吐票外壳轨道 -->
    <div class="receipt-slot">
      <div class="receipt-card" id="receiptCard">
        
        <!-- 弧形标题 (Bagel Fat One Regular, 橙色 #EEA445) -->
        <div class="curved-title">MUKICHIP V2: DAILY SOLVER</div>

        <!-- 中间购物 Muki 插图 (自行替换 shopping-muki.png) -->
        <img src="shopping-muki.png" alt="Shopping Muki" class="shopping-muki-img" onerror="this.src='https://via.placeholder.com/130x90/F8F6F3/926653?text=MIDDLE+MUKI+PNG'">

        <!-- 小票标头 (Bagel Fat One Regular, 褐色 #926653) -->
        <div class="receipt-header-title">- MUKI RECEIPT -</div>

        <!-- 小票元数据 (Liyu Shoushu 字体) -->
        <div class="receipt-meta">
          <div>BUYER: MUKI</div>
          <div>CHECKOUT TIME: <span id="checkoutTime">2026.11.22 20:29:24</span></div>
          <div>TRANSACTION ID: <span id="transactionId">55328675732096</span></div>
        </div>

        <div class="divider-line"></div>
        <!-- 提示问题 (Liyu Shoushu 字体) -->
        <div class="question-prompt">TO BUY OR NOT TO BUY?</div>
        <div class="divider-line"></div>

        <!-- 答案显示区域 (Liyu Shoushu 字体, 褐色 #926653) -->
        <div class="answer-container">
          <p class="zh-text" id="zhDisplay">今天不适合买，等多两天再看看!!</p>
          <p class="en-text" id="enDisplay">NOT A GOOD DAY TO BUY TODAY. WAIT A COUPLE MORE DAYS AND SEE!!</p>
        </div>

        <div class="divider-line"></div>

        <!-- 条形码图片 (自行替换 barcode.png) -->
        <img src="barcode.png" alt="Barcode" class="barcode-img" onerror="this.src='https://via.placeholder.com/260x40/EEA445/F8F6F3?text=|||||||||||||||||||||||||'">

        <!-- 底部印章按钮 (自行替换 ig-stamp.png) -->
        <a href="https://www.instagram.com/yuxuantsuki" target="_blank" rel="noopener noreferrer" class="stamp-link">
          <img src="ig-stamp.png" alt="@yuxuantsuki stamp" class="stamp-img" onerror="this.src='https://via.placeholder.com/85x85/926653/FFFFFF?text=STAMP+PNG'">
        </a>

      </div>
    </div>

    <!-- 底部重新打印提示 -->
    <div class="reprint-tip" onclick="printNewReceipt()">[ 贴一贴 / 点击顶部重新审判 ]</div>

  </div>

  <script>
    /* ========================================================
       DESIRE 剁手决策数据池
       ======================================================== */
    const desireDecisions = [
      {
        zh: "今天不适合买，等多两天再看看!!",
        en: "NOT A GOOD DAY TO BUY TODAY. WAIT A COUPLE MORE DAYS AND SEE!!"
      },
      {
        zh: "立刻买！不买今晚肯定睡不着觉！",
        en: "BUY IT NOW! YOU WON'T SLEEP TONIGHT IF YOU DON'T!"
      },
      {
        zh: "别买了，家里已经有三个同款了！",
        en: "DON'T BUY IT. YOU ALREADY HAVE THREE OF THESE AT HOME!"
      },
      {
        zh: "去找朋友借钱买，快乐最重要！",
        en: "BORROW MONEY FROM A FRIEND AND BUY IT. HAPPINESS FIRST!"
      },
      {
        zh: "关掉页面去喝三大杯白开水冷静一下！",
        en: "CLOSE THE PAGE AND DRINK 3 GLASSES OF WATER TO COOL DOWN!"
      },
      {
        zh: "买买买！赚钱就是用来花的！！",
        en: "BUY BUY BUY! MONEY IS MEANT TO BE SPENT!!"
      },
      {
        zh: "先放购物车，24小时后再决定！",
        en: "ADD TO CART FIRST. DECIDE AFTER 24 HOURS!"
      },
      {
        zh: "今天省下这笔钱，周末请自己吃大餐！",
        en: "SAVE THIS MONEY TODAY AND TREAT YOURSELF TO A FEAST ON THE WEEKEND!"
      },
      {
        zh: "宇宙告诉你：买了这个你会后悔三天的。",
        en: "THE UNIVERSE TELLS YOU: YOU WILL REGRET THIS FOR THREE DAYS."
      },
      {
        zh: "买吧！这是你今天努力生活的奖励！",
        en: "BUY IT! IT'S YOUR REWARD FOR WORKING HARD TODAY!"
      }
    ];

    /* ========================================================
       动态生成时间与 14 位交易单号
       ======================================================== */
    function updateReceiptMeta() {
      const now = new Date();
      const year = now.getFullYear();
      const month = String(now.getMonth() + 1).padStart(2, '0');
      const day = String(now.getDate()).padStart(2, '0');
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const seconds = String(now.getSeconds()).padStart(2, '0');

      document.getElementById('checkoutTime').textContent = `${year}.${month}.${day} ${hours}:${minutes}:${seconds}`;

      // 动态生成 14 位随机 ID
      let randomId = '';
      for (let i = 0; i < 14; i++) {
        randomId += Math.floor(Math.random() * 10);
      }
      document.getElementById('transactionId').textContent = randomId;
    }

    /* ========================================================
       2 秒吐票动画与随机审判逻辑
       ======================================================== */
    let isPrinting = false;

    function printNewReceipt() {
      if (isPrinting) return;
      isPrinting = true;

      const receiptCard = document.getElementById('receiptCard');
      const zhDisplay = document.getElementById('zhDisplay');
      const enDisplay = document.getElementById('enDisplay');

      receiptCard.classList.remove('printing');
      void receiptCard.offsetWidth;
      receiptCard.classList.add('printing');

      updateReceiptMeta();

      const duration = 1200;
      const intervalTime = 60;
      let elapsedTime = 0;

      const timer = setInterval(() => {
        const tempIndex = Math.floor(Math.random() * desireDecisions.length);
        zhDisplay.textContent = desireDecisions[tempIndex].zh;
        enDisplay.textContent = desireDecisions[tempIndex].en;

        elapsedTime += intervalTime;

        if (elapsedTime >= duration) {
          clearInterval(timer);
          
          const finalIndex = Math.floor(Math.random() * desireDecisions.length);
          zhDisplay.textContent = desireDecisions[finalIndex].zh;
          enDisplay.textContent = desireDecisions[finalIndex].en;

          isPrinting = false;
        }
      }, intervalTime);
    }

    window.onload = function() {
      updateReceiptMeta();
    };
  </script>
</body>
</html>
