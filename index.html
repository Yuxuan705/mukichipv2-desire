<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Mukichip - Cyber Receipt Printer</title>
  
  <!-- Google Fonts: Bagel Fat One -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Long+Cang&family=Ma+Shan+Zheng&family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">

  <style>
    /* =========================================================
       Font Definitions & Design Tokens
       ========================================================= */
    @font-face {
      font-family: 'LiyuShoushu';
      src: url('LiyuShoushu.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }

    :root {
      --font-bagel: 'Bagel Fat One', cursive, system-ui;
      --font-liyu: 'LiyuShoushu', 'ZCOOL KuaiLe', 'Ma Shan Zheng', 'Long Cang', 'PingFang SC', sans-serif;
      --color-brown: #9B644F;
      --color-orange: #FCA125;
      --color-bg: #FFFFFF;
      --color-receipt-bg: #F8F6F3;
      --color-receipt-line: rgba(155, 100, 79, 0.35);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--color-bg);
      font-family: var(--font-liyu);
      color: var(--color-brown);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      overflow-x: hidden;
      padding-bottom: 60px;
    }

    /* Main Container Viewport */
    .app-container {
      width: 100%;
      max-width: 420px;
      margin: 0 auto;
      padding: 16px 16px 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }

    /* =========================================================
       Printer Machine Stage
       Layer 1 (Highest: z-index 30): top-desire.png
       Layer 2 (Middle: z-index 20):  Receipt Paper
       Layer 3 (Lowest: z-index 10):  bottom-desire.png
       ========================================================= */
    .machine-stage {
      width: 100%;
      max-width: 360px;
      position: relative;
      cursor: pointer;
      user-select: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: transform 0.15s ease;
    }

    .machine-stage:active {
      transform: scale(0.985);
    }

    /* Layer 1: Top Machine Body (HIGHEST: z-index 30) */
    .printer-top-layer {
      width: 100%;
      position: relative;
      z-index: 30; /* Stays above receipt paper */
      display: flex;
      justify-content: center;
    }

    .printer-top-img {
      width: 100%;
      height: auto;
      display: block;
      filter: drop-shadow(0 6px 12px rgba(155, 100, 79, 0.12));
      pointer-events: none;
    }

    /* Layer 3: Bottom Machine Body (LOWEST: z-index 10) */
    .printer-bottom-layer {
      width: 100%;
      position: absolute;
      top: 190px; /* Aligned via JS on image load/resize */
      left: 0;
      z-index: 10; /* Stays behind receipt paper */
      display: flex;
      justify-content: center;
      pointer-events: none;
    }

    .printer-bottom-img {
      width: 100%;
      height: auto;
      display: block;
      filter: drop-shadow(0 8px 14px rgba(155, 100, 79, 0.1));
    }

    /* Printer Vibration Animation during printing */
    .machine-stage.printing {
      animation: printerShake 0.14s infinite linear;
    }

    @keyframes printerShake {
      0% { transform: translate(0, 0) rotate(0deg); }
      25% { transform: translate(-1.2px, 0.8px) rotate(-0.3deg); }
      50% { transform: translate(1.2px, -0.6px) rotate(0.3deg); }
      75% { transform: translate(-0.8px, -0.6px) rotate(-0.2deg); }
      100% { transform: translate(0, 0) rotate(0deg); }
    }

    /* Tap Hint Bubble (No emoji) */
    .tap-hint {
      position: absolute;
      bottom: -10px;
      background: var(--color-orange);
      color: #FFFFFF;
      font-family: var(--font-bagel);
      font-size: 13px;
      letter-spacing: 0.8px;
      padding: 6px 16px;
      border-radius: 20px;
      box-shadow: 0 4px 10px rgba(252, 161, 37, 0.35);
      pointer-events: none;
      animation: hintFloat 2s ease-in-out infinite;
      z-index: 35;
      transition: opacity 0.3s ease, transform 0.3s ease;
      white-space: nowrap;
    }

    .tap-hint.hidden {
      opacity: 0;
      transform: translateY(6px);
      pointer-events: none;
    }

    @keyframes hintFloat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }

    /* =========================================================
       Layer 2: Receipt Output Slot (MIDDLE: z-index 20)
       Emerges from between top-desire and bottom-desire
       ========================================================= */
    .receipt-slot-container {
      width: 100%;
      max-width: 330px;
      position: relative;
      margin-top: -14px;
      z-index: 20; /* Between top (30) and bottom (10) */
      overflow: hidden;
      padding-top: 10px;
      padding-bottom: 25px;
      min-height: 50px;
    }

    /* The Long Receipt Paper with soft bottom-right drop shadow */
    .receipt {
      width: 100%;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      transform: translateY(-105%);
      transition: transform 0.1s ease;
      will-change: transform;
      /* Soft Gaussian blur drop shadow towards bottom-right */
      filter: drop-shadow(6px 8px 14px rgba(155, 100, 79, 0.12));
    }

    /* Top & Bottom Zigzag Torn Edges */
    .receipt-zigzag-top,
    .receipt-zigzag-bottom {
      width: 100%;
      height: 10px;
      line-height: 0;
      display: block;
    }

    .zigzag-svg {
      width: 100%;
      height: 10px;
      display: block;
    }

    .receipt-zigzag-top {
      margin-bottom: -1px; /* seamless join */
    }

    .receipt-zigzag-bottom {
      margin-top: -1px; /* seamless join */
    }

    /* Receipt Inner Content: plenty of top whitespace */
    .receipt-inner {
      width: 100%;
      background-color: var(--color-receipt-bg);
      padding: 44px 24px 26px; /* Generous top white space */
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    /* Print Slide Down Animation: 2 seconds with mechanical jitter */
    .receipt.anim-printing {
      animation: printFeedDown 2s cubic-bezier(0.2, 0.8, 0.3, 1) forwards;
    }

    .receipt.printed {
      transform: translateY(0);
    }

    @keyframes printFeedDown {
      0% {
        transform: translateY(-100%);
      }
      15% {
        transform: translateY(-80%);
      }
      22% {
        transform: translateY(-80%);
      }
      38% {
        transform: translateY(-55%);
      }
      45% {
        transform: translateY(-54%);
      }
      65% {
        transform: translateY(-28%);
      }
      72% {
        transform: translateY(-27%);
      }
      88% {
        transform: translateY(-6%);
      }
      100% {
        transform: translateY(0%);
      }
    }

    /* =========================================================
       Receipt Elements & Typography
       ========================================================= */
    
    /* 1. Curved Title: MUKICHIP V2: DAILY SOLVER
          Gentle arc, with comfortable distance to shopping-muki */
    .curved-title-container {
      width: 100%;
      height: 52px;
      margin-top: 4px;
      margin-bottom: 6px; /* Increased breathing room to shopping-muki */
      position: relative;
      z-index: 10;
      display: flex;
      justify-content: center;
    }

    .curved-title-svg {
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    .curved-title-svg text {
      font-family: var(--font-bagel);
      fill: var(--color-orange);
      font-size: 17px;
      letter-spacing: 2px;
      text-anchor: middle;
      dominant-baseline: central;
    }

    /* 2. Middle Illustration: shopping-muki.png */
    .shopping-muki-img {
      width: 175px;
      height: auto;
      display: block;
      margin: 0 auto 12px;
      position: relative;
      z-index: 5;
      user-select: none;
      pointer-events: none;
    }

    /* 3. Subtitle: - MUKI RECEIPT - (Strictly single line, nowrap) */
    .receipt-title {
      font-family: var(--font-bagel);
      color: var(--color-brown);
      font-size: 16.5px;
      letter-spacing: 2px;
      margin-bottom: 16px;
      text-transform: uppercase;
      white-space: nowrap; /* Strictly on one row without line breaks */
    }

    /* 4. Metadata Details (Buyer, Checkout Time, Transaction ID)
          English text uniform 11.5px, normal weight, 12px gap to line below */
    .receipt-meta {
      width: 100%;
      text-align: left;
      font-family: var(--font-liyu);
      font-size: 11.5px;
      font-weight: normal;
      color: var(--color-brown);
      line-height: 1.65;
      margin-bottom: 12px; /* 12px gap to the orange line below */
      padding: 0 5px;      /* 5px indent relative to lines */
      letter-spacing: 0.8px;
      text-transform: uppercase;
    }

    .receipt-meta-row {
      display: flex;
      justify-content: flex-start;
      align-items: baseline;
      word-break: break-all;
    }

    .receipt-meta-label {
      font-weight: normal; /* Normal weight, no bold */
      margin-right: 6px;
      white-space: nowrap;
    }

    /* 5. TO BUY OR NOT TO BUY?
          Orange #FCA125, 1.5px thickness, border-radius 999px
          English text uniform 11.5px, normal weight, 12px gap to Chinese text below */
    .decision-divider-container {
      width: 100%;
      margin: 0 0 12px;    /* 12px gap to Chinese text below */
      display: flex;
      flex-direction: column;
      align-items: stretch;
    }

    .orange-divider-line {
      width: 100%;
      height: 1.5px;
      background-color: var(--color-orange);
      border-radius: 999px;
    }

    .decision-header-text {
      font-family: var(--font-liyu);
      font-size: 11.5px;   /* Uniform 11.5px */
      font-weight: normal; /* Normal weight, no bold */
      letter-spacing: 1.5px;
      color: var(--color-brown);
      text-transform: uppercase;
      text-align: left;
      margin-top: 10px;    /* 10px spacing from upper line */
      margin-bottom: 10px; /* 10px spacing from lower line */
      padding: 0 5px;      /* 5px indent relative to lines */
      line-height: 1;
    }

    /* 6. Decision Result Text (Chinese & English)
          Chinese text normal weight (no bold), English text uniform 11.5px, 12px gap to barcode line below */
    .decision-content {
      width: 100%;
      text-align: left;
      margin-bottom: 12px; /* 12px gap to barcode upper line below */
      padding: 0 5px;      /* 5px indent relative to lines */
      min-height: 75px;
    }

    .decision-zh {
      font-family: var(--font-liyu);
      color: var(--color-brown);
      font-size: 20px;
      font-weight: normal; /* Normal weight, no extra bold */
      line-height: 1.45;
      letter-spacing: 1.2px;
      margin-bottom: 8px;
      white-space: pre-line;
    }

    .decision-en {
      font-family: var(--font-liyu);
      color: var(--color-brown);
      font-size: 11.5px;   /* Uniform 11.5px */
      font-weight: normal;
      line-height: 1.4;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      opacity: 0.85;
      white-space: pre-line;
    }

    /* 7. Barcode with Top & Bottom Lines
          Orange #FCA125, 1.5px thickness, border-radius 999px
          Barcode scaled to match exact width of lines, 10px spacing above & below */
    .barcode-wrapper {
      width: 100%;
      margin: 0 0 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .barcode-divider-line {
      width: 100%;
      height: 1.5px;
      background-color: var(--color-orange);
      border-radius: 999px;
    }

    .barcode-img {
      width: 100%;
      max-width: 100%;
      height: auto;
      display: block;
      user-select: none;
      pointer-events: none;
      margin-top: 10px;    /* 10px spacing from upper line */
      margin-bottom: 10px; /* 10px spacing from lower line */
    }

    /* 8. Instagram Stamp Button */
    .stamp-container {
      margin-top: 4px;
      position: relative;
    }

    .stamp-btn {
      display: block;
      width: 82px;
      height: 82px;
      border-radius: 50%;
      cursor: pointer;
      transition: transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1);
      outline: none;
      text-decoration: none;
      -webkit-tap-highlight-color: transparent;
    }

    .stamp-img {
      width: 100%;
      height: 100%;
      display: block;
      user-select: none;
      pointer-events: none;
    }

    /* Press Feedback Animation: scale down 20% (scale(0.8)) */
    .stamp-btn:active {
      transform: scale(0.8) !important;
    }

    /* Print Again Button (No Chinese, No Emoji) */
    .action-bar {
      margin-top: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 0.4s ease, transform 0.4s ease;
    }

    .action-bar.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .reprint-btn {
      background: #FFFFFF;
      border: 1.5px solid var(--color-brown);
      color: var(--color-brown);
      font-family: var(--font-bagel);
      font-size: 13.5px;
      letter-spacing: 1px;
      padding: 9px 24px;
      border-radius: 24px;
      cursor: pointer;
      display: inline-block;
      box-shadow: 0 4px 10px rgba(155, 100, 79, 0.08);
      transition: all 0.2s ease;
    }

    .reprint-btn:hover {
      background: var(--color-brown);
      color: #FFFFFF;
    }

    .reprint-btn:active {
      transform: scale(0.94);
    }
  </style>
</head>

    /* =========================================================
       DOM Elements
       ========================================================= */
    const printerBtn = document.getElementById('printerBtn');
    const tapHint = document.getElementById('tapHint');
    const receiptPaper = document.getElementById('receiptPaper');
    const checkoutTimeEl = document.getElementById('checkoutTime');
    const transactionIdEl = document.getElementById('transactionId');
    const decisionZhEl = document.getElementById('decisionZh');
    const decisionEnEl = document.getElementById('decisionEn');
    const actionBar = document.getElementById('actionBar');
    const reprintBtn = document.getElementById('reprintBtn');

    let isPrinting = false;
    let audioCtx = null;

    /* =========================================================
       Align Printer Machine Layers Pixel-Perfect
       Position bottom-desire.png right below top-desire.png
       ========================================================= */
    function alignPrinterLayers() {
      const topImg = document.querySelector('.printer-top-img');
      const bottomLayer = document.querySelector('.printer-bottom-layer');
      const slotContainer = document.querySelector('.receipt-slot-container');
      if (topImg && bottomLayer && slotContainer) {
        const topH = topImg.offsetHeight;
        if (topH > 0) {
          // Bottom layer connects right at the bottom edge of top-desire (minus small overlap)
          bottomLayer.style.top = `${topH - 10}px`;
          // Receipt emerges from the slot right under the top-desire sign
          slotContainer.style.marginTop = '-12px';
        }
      }
    }

    window.addEventListener('load', alignPrinterLayers);
    window.addEventListener('resize', alignPrinterLayers);
    // Extra safety trigger once images complete rendering
    const topImgEl = document.querySelector('.printer-top-img');
    if (topImgEl && topImgEl.complete) {
      alignPrinterLayers();
    } else if (topImgEl) {
      topImgEl.addEventListener('load', alignPrinterLayers);
    }

    /* =========================================================
       Web Audio API Simulated Thermal Printer Sound ("哧哧哧")
       ========================================================= */
    function playThermalPrinterSound(durationMs = 2000) {
      try {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (!AudioContextClass) return;
        if (!audioCtx) {
          audioCtx = new AudioContextClass();
        }
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }

        const now = audioCtx.currentTime;
        const totalDuration = durationMs / 1000;
        const burstCount = 13;
        const burstInterval = totalDuration / burstCount;

        for (let i = 0; i < burstCount; i++) {
          const burstStart = now + i * burstInterval;
          const burstLen = burstInterval * 0.72;

          // 1. Friction White Noise (needle printing hiss "chhh")
          const bufferSize = Math.floor(audioCtx.sampleRate * burstLen);
          const noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
          const output = noiseBuffer.getChannelData(0);
          for (let j = 0; j < bufferSize; j++) {
            output[j] = Math.random() * 2 - 1;
          }

          const noiseNode = audioCtx.createBufferSource();
          noiseNode.buffer = noiseBuffer;

          const bandpass = audioCtx.createBiquadFilter();
          bandpass.type = 'bandpass';
          bandpass.frequency.setValueAtTime(2600 + (i % 3) * 400, burstStart);
          bandpass.Q.setValueAtTime(3.2, burstStart);

          const noiseGain = audioCtx.createGain();
          noiseGain.gain.setValueAtTime(0, burstStart);
          noiseGain.gain.linearRampToValueAtTime(0.22, burstStart + 0.008);
          noiseGain.gain.exponentialRampToValueAtTime(0.005, burstStart + burstLen);

          noiseNode.connect(bandpass);
          bandpass.connect(noiseGain);
          noiseGain.connect(audioCtx.destination);

          noiseNode.start(burstStart);
          noiseNode.stop(burstStart + burstLen);

          // 2. Stepper Motor Buzz ("zzzt")
          const osc = audioCtx.createOscillator();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(340 + (i % 4) * 35, burstStart);

          const motorFilter = audioCtx.createBiquadFilter();
          motorFilter.type = 'lowpass';
          motorFilter.frequency.setValueAtTime(750, burstStart);

          const oscGain = audioCtx.createGain();
          oscGain.gain.setValueAtTime(0, burstStart);
          oscGain.gain.linearRampToValueAtTime(0.045, burstStart + 0.008);
          oscGain.gain.exponentialRampToValueAtTime(0.001, burstStart + burstLen);

          osc.connect(motorFilter);
          motorFilter.connect(oscGain);
          oscGain.connect(audioCtx.destination);

          osc.start(burstStart);
          osc.stop(burstStart + burstLen);
        }
      } catch (err) {
        console.warn('Web Audio playback error:', err);
      }
    }

    /* =========================================================
       Date & Time Formatter: YYYY.MM.DD HH:mm:ss
       ========================================================= */
    function getCurrentFormattedTime() {
      const now = new Date();
      const pad = (n) => String(n).padStart(2, '0');
      const year = now.getFullYear();
      const month = pad(now.getMonth() + 1);
      const date = pad(now.getDate());
      const hours = pad(now.getHours());
      const minutes = pad(now.getMinutes());
      const seconds = pad(now.getSeconds());
      return `${year}.${month}.${date} ${hours}:${minutes}:${seconds}`;
    }

    /* 8-digit Random Transaction ID */
    function generateTransactionId() {
      return Math.floor(10000000 + Math.random() * 90000000).toString();
    }

    /* =========================================================
       Print Interaction Handler
       ========================================================= */
    let lastDecisionIndex = -1;

    function printReceipt() {
      if (isPrinting) return;
      isPrinting = true;

      // Mobile Haptic Feedback
      if (navigator.vibrate) {
        try { navigator.vibrate([40, 60, 40, 60, 80]); } catch (e) {}
      }

      // Hide tap hint
      tapHint.classList.add('hidden');
      actionBar.classList.remove('visible');

      // Pick a random decision
      let randIndex;
      do {
        randIndex = Math.floor(Math.random() * desireDecisions.length);
      } while (desireDecisions.length > 1 && randIndex === lastDecisionIndex);
      lastDecisionIndex = randIndex;

      const decision = desireDecisions[randIndex];

      // Update receipt text
      checkoutTimeEl.textContent = getCurrentFormattedTime();
      transactionIdEl.textContent = generateTransactionId();
      decisionZhEl.innerHTML = decision.zh.replace(/\n/g, '<br>');
      decisionEnEl.innerHTML = decision.en.replace(/\n/g, '<br>');

      // Start sound & printer shaking
      playThermalPrinterSound(2000);
      printerBtn.classList.add('printing');

      // Reset and trigger receipt feed animation
      receiptPaper.classList.remove('printed', 'anim-printing');
      void receiptPaper.offsetWidth; // force reflow
      receiptPaper.classList.add('anim-printing');

      // 2-second printing animation finished
      setTimeout(() => {
        isPrinting = false;
        printerBtn.classList.remove('printing');
        receiptPaper.classList.remove('anim-printing');
        receiptPaper.classList.add('printed');
        actionBar.classList.add('visible');

        // Smoothly scroll down slightly on small mobile screens
        const rect = receiptPaper.getBoundingClientRect();
        if (rect.bottom > window.innerHeight) {
          window.scrollBy({
            top: 140,
            behavior: 'smooth'
          });
        }
      }, 2000);
    }

    // Event Listeners
    printerBtn.addEventListener('click', printReceipt);
    reprintBtn.addEventListener('click', printReceipt);
